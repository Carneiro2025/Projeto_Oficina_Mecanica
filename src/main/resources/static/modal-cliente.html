<div id="modalCliente" class="modal">

    <div class="modal-content">

        <!-- Cabeçalho -->

        <div class="modal-header">

            <h2 id="tituloModal">

                Cadastro de Cliente

            </h2>

            <button
                id="btnFecharModal"
                class="btn-close">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <!-- Corpo -->

        <div class="modal-body">

            <form id="formCliente">

                <input
                    type="hidden"
                    id="clienteId">

                <!-- Linha 1 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Nome *</label>

                        <input
                            type="text"
                            id="nome"
                            required>

                    </div>

                </div>

                <!-- Linha 2 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>CPF *</label>

                        <input
                            type="text"
                            id="cpf">

                    </div>

                    <div class="form-group">

                        <label>RG</label>

                        <input
                            type="text"
                            id="rg">

                    </div>

                </div>

                <!-- Linha 3 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Telefone</label>

                        <input
                            type="text"
                            id="telefone">

                    </div>

                    <div class="form-group">

                        <label>Celular</label>

                        <input
                            type="text"
                            id="celular">

                    </div>

                </div>

                <!-- Linha 4 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>E-mail</label>

                        <input
                            type="email"
                            id="email">

                    </div>

                </div>

                <!-- Linha 5 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>CEP</label>

                        <input
                            type="text"
                            id="cep">

                    </div>

                    <div class="form-group">

                        <label>Número</label>

                        <input
                            type="text"
                            id="numero">

                    </div>

                </div>

                <!-- Linha 6 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Rua</label>

                        <input
                            type="text"
                            id="rua">

                    </div>

                </div>

                <!-- Linha 7 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Bairro</label>

                        <input
                            type="text"
                            id="bairro">

                    </div>

                    <div class="form-group">

                        <label>Cidade</label>

                        <input
                            type="text"
                            id="cidade">

                    </div>

                    <div class="form-group">

                        <label>UF</label>

                        <input
                            type="text"
                            id="estado"
                            maxlength="2">

                    </div>

                </div>

                <!-- Linha 8 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Complemento</label>

                        <input
                            type="text"
                            id="complemento">

                    </div>

                </div>

                <!-- Linha 9 -->

                <div class="form-row">

                    <div class="form-group">

                        <label>Observações</label>

                        <textarea
                            id="observacoes"
                            rows="4"></textarea>

                    </div>

                </div>

            </form>

        </div>

        <!-- Rodapé -->

        <div class="modal-footer">

            <button
                id="btnCancelar"
                class="btn btn-secondary">

                Cancelar

            </button>

            <button
                id="btnSalvarCliente"
                class="btn btn-primary">

                <i class="bi bi-check-circle"></i>

                Salvar

            </button>

        </div>

    </div>

</div>
