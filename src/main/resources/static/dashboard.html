<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | OficinaPRO</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>

    <div id="sidebar"></div>

    <main class="main">

        <header class="header">

            <h1>Painel Administrativo</h1>

            <span id="usuarioLogado"></span>

        </header>

        <section class="cards">

            <div class="card" onclick="location.href='clientes.html'">

                <i class="bi bi-people-fill"></i>

                <h3>Clientes</h3>

            </div>

            <div class="card" onclick="location.href='veiculos.html'">

                <i class="bi bi-car-front-fill"></i>

                <h3>Veículos</h3>

            </div>

            <div class="card" onclick="location.href='ordens-servico.html'">

                <i class="bi bi-tools"></i>

                <h3>Ordens de Serviço</h3>

            </div>

            <div class="card" onclick="location.href='produtos.html'">

                <i class="bi bi-box-seam"></i>

                <h3>Produtos</h3>

            </div>

            <div class="card" onclick="location.href='estoque.html'">

                <i class="bi bi-boxes"></i>

                <h3>Estoque</h3>

            </div>

            <div class="card" onclick="location.href='financeiro.html'">

                <i class="bi bi-cash-stack"></i>

                <h3>Financeiro</h3>

            </div>

            <div class="card" onclick="location.href='usuarios.html'">

                <i class="bi bi-person-badge-fill"></i>

                <h3>Usuários</h3>

            </div>

            <div class="card" onclick="location.href='relatorios.html'">

                <i class="bi bi-graph-up-arrow"></i>

                <h3>Relatórios</h3>

            </div>

        </section>

    </main>

    <script src="js/sidebar.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
