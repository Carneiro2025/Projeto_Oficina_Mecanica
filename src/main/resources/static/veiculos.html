<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veículos | OficinaPRO</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/veiculos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>

<div id="sidebar"></div>

<main class="main">

    <header class="header">

        <h1>Cadastro de Veículos</h1>

        <button class="btn-primary" id="btnNovo">

            <i class="bi bi-plus-circle"></i>

            Novo Veículo

        </button>

    </header>

    <section class="pesquisa">

        <input
            type="text"
            id="txtPesquisar"
            placeholder="Pesquisar por Placa, Modelo ou Cliente">

        <button id="btnPesquisar">

            <i class="bi bi-search"></i>

            Pesquisar

        </button>

    </section>

    <section class="tabela">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Placa</th>

                    <th>Marca</th>

                    <th>Modelo</th>

                    <th>Ano</th>

                    <th>Cliente</th>

                    <th>Ações</th>

                </tr>

            </thead>

            <tbody id="tbodyVeiculos">

            </tbody>

        </table>

    </section>

</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/loading.js"></script>
<script src="js/toast.js"></script>
<script src="js/veiculos.js"></script>

</body>

</html>
