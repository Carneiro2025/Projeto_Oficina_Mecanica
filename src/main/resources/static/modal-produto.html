<div id="modalProduto" class="modal">

    <div class="modal-content modal-lg">

        <!-- ======================================================
             HEADER
        ======================================================= -->

        <div class="modal-header">

            <h2 id="tituloModalProduto">

                <i class="bi bi-box-seam-fill"></i>

                Cadastro de Produto

            </h2>

            <button
                id="btnFecharModalProduto"
                class="btn-close">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>

        <!-- ======================================================
             BODY
        ======================================================= -->

        <div class="modal-body">

            <form id="formProduto">

                <input
                    type="hidden"
                    id="produtoId">

                <!-- ==============================================
                     ABAS
                =============================================== -->

                <div class="tabs">

                    <button
                        type="button"
                        class="tab-button active"
                        data-tab="geral">

                        Dados Gerais

                    </button>

                    <button
                        type="button"
                        class="tab-button"
                        data-tab="estoque">

                        Estoque

                    </button>

                    <button
                        type="button"
                        class="tab-button"
                        data-tab="valores">

                        Valores

                    </button>

                    <button
                        type="button"
                        class="tab-button"
                        data-tab="fiscal">

                        Fiscal

                    </button>

                    <button
                        type="button"
                        class="tab-button"
                        data-tab="observacoes">

                        Observações

                    </button>

                </div>

                <!-- ==============================================
                     ABA DADOS GERAIS
                =============================================== -->

                <div
                    id="tab-geral"
                    class="tab-content active">

                    <div class="form-row">

                        <div class="form-group">

                            <label>Código *</label>

                            <input
                                type="text"
                                id="codigo"
                                required>

                        </div>

                        <div class="form-group">

                            <label>Referência</label>

                            <input
                                type="text"
                                id="referencia">

                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>Código de Barras</label>

                            <input
                                type="text"
                                id="codigoBarras">

                        </div>

                        <div class="form-group">

                            <label>Descrição *</label>

                            <input
                                type="text"
                                id="descricao"
                                required>

                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>Categoria *</label>

                            <select id="categoriaId">

                                <option value="">

                                    Selecione

                                </option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>Marca</label>

                            <input
                                type="text"
                                id="marca">

                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>Unidade *</label>

                            <select id="unidade">

                                <option>UN</option>
                                <option>CX</option>
                                <option>PC</option>
                                <option>KG</option>
                                <option>LT</option>
                                <option>M</option>

                            </select>

                        </div>

                        <div class="form-group">

                            <label>Situação</label>

                            <select id="ativo">

                                <option value="true">

                                    Ativo

                                </option>

                                <option value="false">

                                    Inativo

                                </option>

                            </select>

                        </div>

                    </div>

                </div>

                                <!-- ==============================================
                     ABA ESTOQUE
                =============================================== -->

                <div
                    id="tab-estoque"
                    class="tab-content">

                    <div class="form-row">

                        <div class="form-group">

                            <label>Estoque Atual *</label>

                            <input
                                type="number"
                                id="estoqueAtual"
                                value="0"
                                min="0">

                        </div>

                        <div class="form-group">

                            <label>Estoque Mínimo *</label>

                            <input
                                type="number"
                                id="estoqueMinimo"
                                value="0"
                                min="0">

                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>Estoque Máximo</label>

                            <input
                                type="number"
                                id="estoqueMaximo"
                                value="0"
                                min="0">

                        </div>

                        <div class="form-group">

                            <label>Localização</label>

                            <input
                                type="text"
                                id="localizacao"
                                placeholder="Ex.: Prateleira A-03">

                        </div>

                    </div>

                </div>

                <!-- ==============================================
                     ABA VALORES
                =============================================== -->

                <div
                    id="tab-valores"
                    class="tab-content">

                    <div class="form-row">

                        <div class="form-group">

                            <label>Valor de Compra *</label>

                            <input
                                type="number"
                                id="valorCompra"
                                step="0.01"
                                min="0">

                        </div>

                        <div class="form-group">

                            <label>Valor de Venda *</label>

                            <input
                                type="number"
                                id="valorVenda"
                                step="0.01"
                                min="0">

                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>Lucro (R$)</label>

                            <input
                                type="text"
                                id="lucro"
                                readonly>

                        </div>

                        <div class="form-group">

                            <label>Margem (%)</label>

                            <input
                                type="text"
                                id="margemLucro"
                                readonly>

                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label>Fornecedor Principal</label>

                            <select id="fornecedorId">

                                <option value="">

                                    Selecione...

                                </option>

                            </select>

                        </div>

                    </div>

                </div>
