<div id="modalContaPagar" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Nova Conta a Pagar</h2>

            <button id="btnFecharModalContaPagar" class="btn-close">
                <i class="bi bi-x-lg"></i>
            </button>

        </div>

        <div class="modal-body">

            <form id="formContaPagar">

                <div class="form-row">

                    <div class="form-group">

                        <label>Fornecedor *</label>

                        <select id="fornecedorId" required>
                            <option value="">Selecione...</option>
                        </select>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Descrição *</label>

                        <input type="text" id="descricaoContaPagar" required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Valor *</label>

                        <input type="number" id="valorContaPagar" step="0.01" min="0.01" required>

                    </div>

                    <div class="form-group">

                        <label>Vencimento *</label>

                        <input type="date" id="dataVencimentoContaPagar" required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Observação</label>

                        <textarea id="observacaoContaPagar" rows="3"></textarea>

                    </div>

                </div>

            </form>

        </div>

        <div class="modal-footer">

            <button id="btnCancelarContaPagar" class="btn btn-secondary">Cancelar</button>

            <button id="btnSalvarContaPagar" class="btn btn-primary">
                <i class="bi bi-check-circle"></i>
                Salvar
            </button>

        </div>

    </div>

</div>

<div id="modalPagamento" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Registrar Pagamento</h2>

            <button id="btnFecharModalPagamento" class="btn-close">
                <i class="bi bi-x-lg"></i>
            </button>

        </div>

        <div class="modal-body">

            <form id="formPagamento">

                <input type="hidden" id="contaPagarId">

                <div class="form-row">

                    <div class="form-group">

                        <label>Data do Pagamento *</label>

                        <input type="date" id="dataPagamento" required>

                    </div>

                    <div class="form-group">

                        <label>Forma de Pagamento *</label>

                        <select id="formaPagamento" required>
                            <option value="">Selecione...</option>
                            <option value="DINHEIRO">Dinheiro</option>
                            <option value="PIX">PIX</option>
                            <option value="CARTAO_DEBITO">Cartão de Débito</option>
                            <option value="CARTAO_CREDITO">Cartão de Crédito</option>
                            <option value="BOLETO">Boleto</option>
                            <option value="TRANSFERENCIA">Transferência</option>
                        </select>

                    </div>

                </div>

            </form>

        </div>

        <div class="modal-footer">

            <button id="btnCancelarPagamento" class="btn btn-secondary">Cancelar</button>

            <button id="btnConfirmarPagamento" class="btn btn-primary">
                <i class="bi bi-check-circle"></i>
                Confirmar
            </button>

        </div>

    </div>

</div>
