<div id="modalMovimentacao" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Movimentar Estoque</h2>

            <button id="btnFecharModalMovimentacao" class="btn-close">
                <i class="bi bi-x-lg"></i>
            </button>

        </div>

        <div class="modal-body">

            <form id="formMovimentacao">

                <div class="form-row">

                    <div class="form-group">

                        <label>Produto *</label>

                        <select id="produtoId" required>
                            <option value="">Selecione...</option>
                        </select>

                        <small id="estoqueAtualInfo"></small>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Tipo *</label>

                        <select id="tipoMovimentacao" required>
                            <option value="">Selecione...</option>
                            <option value="ENTRADA">Entrada</option>
                            <option value="SAIDA">Saída</option>
                            <option value="DEVOLUCAO">Devolução</option>
                            <option value="AJUSTE">Ajuste</option>
                        </select>

                    </div>

                    <div class="form-group">

                        <label>Quantidade *</label>

                        <input type="number" id="quantidade" min="1" required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">

                        <label>Observação</label>

                        <textarea id="observacao" rows="3"></textarea>

                    </div>

                </div>

            </form>

        </div>

        <div class="modal-footer">

            <button id="btnCancelarMovimentacao" class="btn btn-secondary">
                Cancelar
            </button>

            <button id="btnSalvarMovimentacao" class="btn btn-primary">
                <i class="bi bi-check-circle"></i>
                Registrar
            </button>

        </div>

    </div>

</div>

<div id="modalHistorico" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Histórico de Movimentações</h2>

            <button id="btnFecharModalHistorico" class="btn-close">
                <i class="bi bi-x-lg"></i>
            </button>

        </div>

        <div class="modal-body">

            <table>

                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Tipo</th>
                        <th>Quantidade</th>
                        <th>Observação</th>
                    </tr>
                </thead>

                <tbody id="tbodyHistorico"></tbody>

            </table>

        </div>

    </div>

</div>
