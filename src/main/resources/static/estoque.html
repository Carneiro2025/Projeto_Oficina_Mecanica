<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque | OficinaPRO</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/estoque.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/modal-estoque.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>

<div id="sidebar"></div>

<main class="main">

    <header class="header">

        <h1>Controle de Estoque</h1>

        <button class="btn-primary btn-movimentar" id="btnNovaMovimentacao">

            <i class="bi bi-arrow-left-right"></i>

            Nova Movimentação

        </button>

    </header>

    <section class="pesquisa">

        <input
            type="text"
            id="txtPesquisar"
            placeholder="Pesquisar por descrição ou código">

        <label style="display:flex; align-items:center; gap:8px; white-space:nowrap;">
            <input type="checkbox" id="chkApenasEstoqueBaixo">
            Só estoque baixo
        </label>

        <button id="btnPesquisar">

            <i class="bi bi-search"></i>

            Pesquisar

        </button>

    </section>

    <section class="tabela">

        <table>

            <thead>

                <tr>

                    <th>Código</th>

                    <th>Descrição</th>

                    <th>Estoque Atual</th>

                    <th>Estoque Mínimo</th>

                    <th>Situação</th>

                    <th>Ações</th>

                </tr>

            </thead>

            <tbody id="tbodyEstoque">
            </tbody>

        </table>

    </section>

</main>

<div id="modalEstoqueContainer"></div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/loading.js"></script>
<script src="js/toast.js"></script>
<script src="js/modal-estoque.js"></script>
<script src="js/estoque.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {

        auth.checkAuthentication();

        try {

            const html = await (await fetch("modal-estoque.html")).text();

            document.getElementById("modalEstoqueContainer").innerHTML = html;

            if (typeof configurarEventosModalEstoque === "function") {
                configurarEventosModalEstoque();
            }

        } catch (erro) {
            console.error("Erro ao carregar modal de estoque:", erro);
        }

        if (typeof inicializarEstoque === "function") {
            inicializarEstoque();
        }

    });
</script>

</body>

</html>
